<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#634832" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PROATIVX" />
    <title>PROATIVX - Sistema de Gestão para Negócios Criativos</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="O PROATIVX é o sistema tudo-em-um para gerenciar pedidos, clientes, produção e finanças do seu negócio criativo. Chega de planilhas!">
    <meta name="keywords"
        content="gestão papelaria, sistema para gráfica, controle de pedidos, ERP papelaria, gestão de produção, controle financeiro, sistema para personalizados">
    <meta name="author" content="PROATIVX">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://proativx.vercel.app/">
    <meta property="og:title" content="PROATIVX - Sistema de Gestão para Negócios Criativos">
    <meta property="og:description"
        content="O sistema tudo-em-um para gerenciar pedidos, clientes, produção e finanças. Chega de planilhas e desorganização!">
    <meta property="og:image" content="https://proativx.vercel.app/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://proativx.vercel.app/">
    <meta property="twitter:title" content="PROATIVX - Sistema de Gestão para Negócios Criativos">
    <meta property="twitter:description"
        content="O sistema tudo-em-um para gerenciar pedidos, clientes, produção e finanças. Chega de planilhas e desorganização!">
    <meta property="twitter:image" content="https://proativx.vercel.app/og-image.png">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#634832', // Retro Brown
                        secondary: '#386641', // Retro Green
                        'background-light': '#F2E8CF', // Cream White
                        'background-dark': '#1A1C1C', // Dark Retro
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
